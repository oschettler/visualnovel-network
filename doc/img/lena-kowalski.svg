<path d="M 168 402 C 178 396 190 393 200 393 C 210 393 222 396 232 402" fill="none" stroke="#111111" stroke-width="2" opacity="0.6"/>

<!-- neck -->
<path d="M 179 330 C 179 352 181 368 187 384 L 213 384 C 219 368 221 352 221 330 Z"
