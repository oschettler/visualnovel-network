<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
<rect x="0" y="0" width="400" height="520" fill="#ffffff"/>

<!-- shoulders / jacket, collar up -->
<path d="M 55 520
  C 62 452 100 408 145 390
  L 130 430 L 168 402
  C 178 408 190 411 200 411
  C 210 411 222 408 232 402
  L 270 430 L 255 390
  C 300 408 338 452 345 520 Z"
