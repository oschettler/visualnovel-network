	<title >Wie eine Zeichnung ins Spiel kommt</title>
	<desc >#title: Wie eine Zeichnung ins Spiel kommt
	#direction: down
	#spacing: 70
	#padding: 12
	#background: white
	
	[&lt;frame&gt;ink.py|
	  Pen-Klasse|
	  Striche mit variabler Breite
	]
	
	[&lt;frame&gt;portraits.py / szenen.py|
	  GEO und UMRISS je Figur|
	  Formenschatz je Ort
	]
	
	[&lt;frame&gt;emotes.csv|
	  Mundbogen, Brauen,|
	  Lid, Pupille je Emote
	]
	
	[&lt;frame&gt;doc/img/*.svg|
	  eine Datei je Emote|
	  bzw. je Hintergrund|
	  Figuren: weisse Silhouette,|
	  Rest durchsichtig
	]
	
	[&lt;frame&gt;art.csv|
	  Manifest: svg, gif,|
	  Breite, Hoehe, transparent
	]
	
	[&lt;frame&gt;render_art.py|
	  rsvg-convert, dann magick|
	  Alphakanal als Maske|
	  fuer die Figuren
	]
	
	[&lt;frame&gt;game/data/art/*.gif|
	  Figuren: Muster 0, 1, 32|
	  Hintergruende: ohne 0|
	  lilt-lesbar
	]
	
	[emotes.csv] -&gt; [portraits.py / szenen.py]
	[portraits.py / szenen.py] -&gt; [doc/img/*.svg]
	[ink.py] -&gt; [portraits.py / szenen.py]
	[doc/img/*.svg] -&gt; [art.csv]
	[art.csv] liest -&gt; [render_art.py]
	[render_art.py] schreibt -&gt; [game/data/art/*.gif]
	</desc>
